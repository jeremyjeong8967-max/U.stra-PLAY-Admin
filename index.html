<style>
/* Design tokens and responsive admin layout. */ :root {
  --navy: #172b4d;
  --blue: #0354ff;
  --blue2: #edf3ff;
  --ink: #192538;
  --muted: #718096;
  --line: #e7ebf1;
  --bg: #f6f9ff;
  --green: #14845b;
  --amber: #b66b00;
  --red: #c33b46;
  --shadow: 0 8px 26px #20365b0d
}
* {
  box-sizing: border-box
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size: 14px
}
button,input,select,textarea {
  font: inherit
}
button {
  cursor: pointer
}
.app {
  min-height: 100vh
}
.sidebar {
  width: 248px;
  background: #fff;
  border-right: 1px solid var(--line);
  position: fixed;
  inset: 0 auto 0 0;
  padding: 22px 14px;
  z-index: 8;
  display: flex;
  flex-direction: column
}
.brand {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 12px;
  margin-bottom: 25px
}
.brand-mark {
  background: linear-gradient(145deg,#2b6cf0,#1243b5);
  width: 35px;
  height: 35px;
  border-radius: 10px;
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 17px;
  font-weight: 800;
  box-shadow: 0 5px 12px #2463eb33
}
.brand strong {
  font-size: 18px;
  letter-spacing: -.5px
}
.brand small {
  display: block;
  font-size: 10px;
  color: #8994a5;
  letter-spacing: 1.5px;
  margin-top: 1px
}
.group-label {
  font-size: 10px;
  font-weight: 700;
  color: #a2aab7;
  padding: 12px 13px 7px;
  letter-spacing: 1px
}
.nav {
  display: grid;
  gap: 4px
}
.nav button {
  height: 43px;
  padding: 0 13px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  text-align: left;
  color: #59677c;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 500
}
.nav button:hover {
  background: #f5f7fb
}
.nav button.active {
  background: var(--blue2);
  color: var(--blue);
  font-weight: 700
}
.ico {
  width: 19px;
  text-align: center;
  font-size: 16px
}
.sidebar-bottom {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding: 15px 8px 0
}
.user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px
}
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #e9efff;
  color: #315cc7;
  display: grid;
  place-items: center;
  font-weight: 700
}
.user b {
  font-size: 12px
}
.user small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px
}
.main {
  margin-left: 248px;
  min-height: 100vh
}
.topbar {
  height: 68px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 34px;
  position: sticky;
  top: 0;
  z-index: 5
}
.crumb {
  font-size: 13px;
  color: #8490a1
}
.crumb b {
  color: var(--ink)
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 13px;
  color: #65748a
}
.icon-btn {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  color: #607087
}
.content {
  max-width: 1440px;
  margin: auto;
  padding: 29px 34px 56px
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 24px;
  gap: 16px
}
.page-head h1 {
  font-size: 23px;
  margin: 0 0 6px;
  letter-spacing: -.7px
}
.page-head p {
  color: var(--muted);
  margin: 0;
  font-size: 13px
}
.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap
}
.btn {
  border: 1px solid #dfe5ed;
  background: #fff;
  color: #34445b;
  border-radius: 7px;
  padding: 9px 14px;
  font-weight: 600;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap
}
.btn:hover {
  background: #f8faff
}
.btn.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  box-shadow: 0 3px 7px #2463eb27
}
.btn.primary:hover {
  background: #1b55cf
}
.btn.danger {
  color: var(--red);
  border-color: #f0d7da
}
.btn.sm {
  padding: 6px 9px;
  font-size: 11px
}
.grid {
  display: grid;
  gap: 16px
}
.stats-grid {
  grid-template-columns: repeat(4,minmax(0,1fr));
  margin-bottom: 18px
}
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow)
}
.stat {
  padding: 19px 20px
}
.stat-top {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px
}
.stat-icon {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: #f0f4ff;
  color: #426fe4;
  display: grid;
  place-items: center;
  font-size: 16px
}
.stat-value {
  font-size: 27px;
  font-weight: 700;
  margin: 8px 0 1px;
  letter-spacing: -1px
}
.stat-foot {
  font-size: 11px;
  color: #8994a3
}
.positive {
  color: var(--green);
  font-weight: 600
}
.dash-grid {
  grid-template-columns: 1.55fr 1fr
}
.card-head {
  padding: 17px 20px 13px;
  border-bottom: 1px solid #eff1f4;
  display: flex;
  align-items: center;
  justify-content: space-between
}
.card-head h3 {
  margin: 0;
  font-size: 14px
}
.card-head span {
  font-size: 11px;
  color: var(--muted)
}
.card-body {
  padding: 17px 20px
}
.chart {
  height: 210px;
  position: relative;
  padding: 15px 4px 21px 35px
}
.chart-grid {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: repeating-linear-gradient(to bottom,transparent 0,transparent 50px,#edf0f4 51px,#edf0f4 52px)
}
.chart svg {
  position: absolute;
  inset: 15px 4px 21px 35px;
  width: calc(100% - 39px);
  height: calc(100% - 36px);
  overflow: visible
}
.chart-labels {
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 15px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 10px;
  color: #98a2b2
}
.x-labels {
  position: absolute;
  left: 37px;
  right: 3px;
  bottom: 0;
  display: flex;
  justify-content: space-between;
  color: #8b96a6;
  font-size: 10px
}
.activity {
  display: grid;
  gap: 15px
}
.activity-row {
  display: flex;
  align-items: flex-start;
  gap: 11px
}
.activity-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #4b77ed;
  margin-top: 5px;
  box-shadow: 0 0 0 4px #eff3ff
}
.activity-row b {
  font-size: 12px;
  font-weight: 600
}
.activity-row p {
  margin: 3px 0;
  color: var(--muted);
  font-size: 11px
}
.activity-row time {
  margin-left: auto;
  font-size: 10px;
  color: #9ca6b4;
  white-space: nowrap
}
.table-card {
  overflow: hidden
}
.filters {
  padding: 15px 18px;
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line)
}
.field-input,.field-select {
  height: 35px;
  border: 1px solid #dfe5ed;
  border-radius: 7px;
  background: #fff;
  padding: 0 10px;
  color: #33445b;
  font-size: 12px;
  outline: none
}
.field-input:focus,.field-select:focus,textarea:focus {
  border-color: #7da0f3;
  box-shadow: 0 0 0 3px #2463eb13
}
.search {
  min-width: 230px
}
.filters .spacer {
  flex: 1
}
.table-wrap {
  overflow: auto
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 790px
}
th {
  text-align: left;
  background: #fbfcfd;
  color: #8290a3;
  font-weight: 600;
  font-size: 11px;
  padding: 12px 17px;
  white-space: nowrap
}
td {
  padding: 14px 17px;
  border-top: 1px solid #eff1f4;
  font-size: 12px;
  vertical-align: middle
}
tbody tr:hover {
  background: #fcfdff
}
.event-title {
  font-weight: 700;
  color: #25344a
}
.subtext {
  font-size: 10px;
  color: #8d98a7;
  margin-top: 4px
}
.pill {
  border-radius: 20px;
  padding: 4px 9px;
  font-size: 10px;
  font-weight: 700;
  display: inline-block
}
.pill.active {
  background: #e9f7f0;
  color: #14845b
}
.pill.scheduled {
  background: #fff4df;
  color: #a86400
}
.pill.ended {
  background: #f0f2f5;
  color: #758092
}
.pill.draft {
  background: #eef1ff;
  color: #5568bb
}
.row-actions {
  display: flex;
  gap: 5px
}
.empty {
  padding: 45px;
  text-align: center;
  color: var(--muted)
}
.empty b {
  display: block;
  color: #3b4b62;
  margin: 8px
}
.game-grid {
  grid-template-columns: repeat(4,minmax(0,1fr))
}
.game-card {
  padding: 20px;
  transition: .18s;
  cursor: pointer
}
.game-card:hover {
  transform: translateY(-2px);
  border-color: #b8cafa;
  box-shadow: 0 9px 24px #20365b12
}
.game-emoji {
  width: 43px;
  height: 43px;
  border-radius: 11px;
  background: #eff4ff;
  display: grid;
  place-items: center;
  font-size: 22px;
  margin-bottom: 15px
}
.game-card h3 {
  font-size: 14px;
  margin: 0 0 6px
}
.game-card p {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  margin: 0 0 15px
}
.game-meta {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  color: #8290a0;
  font-size: 10px;
  display: flex;
  justify-content: space-between
}
.panel {
  padding: 20px;
  margin-bottom: 15px
}
.panel h3 {
  font-size: 14px;
  margin: 0 0 5px
}
.panel .help {
  font-size: 11px;
  color: var(--muted);
  margin: 0 0 17px
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 15px 18px
}
.form-item {
  display: flex;
  flex-direction: column;
  gap: 6px
}
.form-item.full {
  grid-column: 1/-1
}
.form-item label {
  font-size: 11px;
  font-weight: 700;
  color: #536176
}
.form-item label em {
  color: var(--red);
  font-style: normal
}
.form-item input,.form-item select,.form-item textarea {
  width: 100%;
  border: 1px solid #dfe5ed;
  border-radius: 7px;
  padding: 9px 10px;
  color: #26364d;
  font-size: 12px;
  outline: none
}
.form-item input,.form-item select {
  height: 38px
}
.form-item textarea {
  resize: vertical;
  min-height: 76px
}
.form-item small {
  font-size: 10px;
  color: #8b96a5
}
.game-picker {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 9px
}
.game-option {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  padding: 12px;
  text-align: left;
  color: #34445b
}
.game-option.selected {
  border-color: var(--blue);
  background: #f5f8ff;
  box-shadow: 0 0 0 2px #2463eb12
}
.game-option .e {
  font-size: 19px
}
.game-option b {
  display: block;
  margin-top: 5px;
  font-size: 11px
}
.game-option small {
  display: block;
  color: #8793a3;
  font-size: 9px;
  margin-top: 3px
}
.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid #eff1f4;
  padding: 12px 0
}
.switch {
  appearance: none;
  width: 34px;
  height: 19px;
  border-radius: 20px;
  background: #cbd2dd;
  position: relative;
  cursor: pointer;
  transition: .15s
}
.switch:checked {
  background: var(--blue)
}
.switch:before {
  content: '';
  position: absolute;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: white;
  left: 2px;
  top: 2px;
  transition: .15s;
  box-shadow: 0 1px 3px #0002
}
.switch:checked:before {
  left: 17px
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #14223866;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px
}
.modal-backdrop.show {
  display: flex
}
.modal {
  background: #fff;
  border-radius: 12px;
  width: min(760px,100%);
  max-height: 90vh;
  overflow: auto;
  box-shadow: 0 24px 80px #15233c4a
}
.modal.wide {
  width: min(900px,100%)
}
.modal-head {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #fff;
  padding: 17px 21px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center
}
.modal-head h2 {
  font-size: 16px;
  margin: 0
}
.close {
  border: 0;
  background: transparent;
  color: #7c8999;
  font-size: 21px
}
.modal-body {
  padding: 20px
}
.modal-foot {
  position: sticky;
  bottom: 0;
  background: #fff;
  border-top: 1px solid var(--line);
  padding: 13px 20px;
  display: flex;
  justify-content: flex-end;
  gap: 8px
}
.preview-shell {
  background: #f2f5f9;
  border-radius: 12px;
  padding: 22px;
  display: flex;
  justify-content: center
}
.phone {
  width: 330px;
  min-height: 500px;
  background: #fff;
  border-radius: 22px;
  box-shadow: 0 9px 28px #1b2d4a18;
  overflow: hidden
}
.phone-top {
  height: 29px;
  background: #14223c;
  color: #fff;
  text-align: center;
  font-size: 9px;
  padding: 8px
}
.phone-hero {
  height: 150px;
  background: linear-gradient(135deg,#285dd9,#7d8ff4);
  color: white;
  padding: 21px;
  display: flex;
  flex-direction: column;
  justify-content: end
}
.phone-hero small {
  opacity: .8;
  font-size: 10px
}
.phone-hero b {
  font-size: 21px;
  margin-top: 4px
}
.phone-content {
  padding: 20px;
  text-align: center
}
.phone-content p {
  color: #758197;
  font-size: 11px;
  line-height: 1.7
}
.game-art {
  font-size: 65px;
  margin: 15px
}
.phone button {
  border: 0;
  background: var(--blue);
  color: #fff;
  border-radius: 8px;
  padding: 11px;
  width: 100%;
  font-size: 12px;
  font-weight: 700
}
.notice {
  border-radius: 8px;
  padding: 12px 14px;
  background: #f2f6ff;
  color: #4f638a;
  font-size: 11px;
  line-height: 1.6
}
.settings-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translate(-50%,15px);
  background: #192b48;
  color: white;
  padding: 11px 17px;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
  z-index: 40;
  box-shadow: 0 8px 20px #14223c33;
  font-size: 12px
}
.toast.show {
  opacity: 1;
  transform: translate(-50%,0)
}
.mobile-menu {
  display: none
}
@media(max-width:1100px) {
  .stats-grid {
    grid-template-columns: repeat(2,1fr)
  }
  .game-grid {
    grid-template-columns: repeat(2,1fr)
  }
  .dash-grid {
    grid-template-columns: 1fr
  }
  .game-picker {
    grid-template-columns: repeat(2,1fr)
  }
}
@media(max-width:760px) {
  .sidebar {
    transform: translateX(-100%);
    transition: .2s;
    box-shadow: 0 0 30px #14223822
  }
  .sidebar.open {
    transform: none
  }
  .main {
    margin-left: 0
  }
  .topbar {
    height: 58px;
    padding: 0 16px
  }
  .mobile-menu {
    display: inline-flex
  }
  .content {
    padding: 21px 15px 40px
  }
  .page-head {
    align-items: flex-start
  }
  .page-head h1 {
    font-size: 20px
  }
  .page-head p {
    font-size: 11px
  }
  .stats-grid {
    gap: 10px
  }
  .stat {
    padding: 14px
  }
  .stat-value {
    font-size: 23px
  }
  .stat-foot {
    font-size: 10px
  }
  .game-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px
  }
  .game-card {
    padding: 15px
  }
  .form-grid,.settings-cols {
    grid-template-columns: 1fr
  }
  .form-item.full {
    grid-column: auto
  }
  .game-picker {
    grid-template-columns: 1fr 1fr
  }
  .filters {
    padding: 12px
  }
  .search {
    width: 100%;
    min-width: 0
  }
  .filters .spacer {

<script>
// 공통 데모 데이터 규약. 두 HTML에 같은 코드를 내장해 별도 의존성 없이 실행합니다.
// 실제 서비스에서는 이 저장소와 URL 스냅샷을 인증된 서버 API로 교체하세요.
const DemoStore = (() => {
  const ENTRY_PREFIX = 'gplay_entry_v2:';
  const DEFAULT_SETTINGS = {
    name: 'U.stra PLAY', organization: '서비스 운영팀', hours: 'office',
    notifications: true, statistics: true, preview: true,
  };
  function read(key, fallback) {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  }
  function records() {
    // 기존 배열은 읽기 전용으로 병합합니다. 새 기록은 참여별 키에 저장합니다.
    const legacy = read('gplay_participations', []);
    const map = new Map((Array.isArray(legacy) ? legacy : [])
    .filter(row => row && row.id && row.eventId).map(row => [row.id, row]));
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key?.startsWith(ENTRY_PREFIX)) continue;
      const row = read(key, null);
      if (row?.id && row.eventId) map.set(row.id, row);
    }
    return [...map.values()];
  }
  function saveRecord(row) {
    localStorage.setItem(ENTRY_PREFIX + row.id, JSON.stringify(row));
  }
  function clearRecords() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key?.startsWith(ENTRY_PREFIX)) keys.push(key);
    }
    keys.forEach(key => localStorage.removeItem(key));
    localStorage.removeItem('gplay_participations');
  }
  function settings() {
    try {
      const saved = read('gplay_settings_v2', {}) || {};
      // Migrate only the former default brand; preserve custom workspace names.
      const name = saved.name === 'G-PLAY' ? DEFAULT_SETTINGS.name : (saved.name || DEFAULT_SETTINGS.name);
      return { ...DEFAULT_SETTINGS, ...saved, name };
    } catch {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function uid() {
    return self.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  }
  async function locked(callback) {
    // Web Locks가 있으면 같은 출처의 여러 탭에서 등록/완료를 직렬화합니다.
    if (navigator.locks) return navigator.locks.request('gplay-participation-v2', callback);
    throw new Error('이 브라우저에서는 참여 잠금을 지원하지 않습니다. 최신 Edge/Chrome에서 열어주세요.');
  }
  function prizes(config) {
    return String(config.prizeItems || '').split(/\r?\n/).filter(line => line.trim()).map(line => {
      const parts = line.split('|').map(value => value.trim());
      return {
        name: parts[0], weight: Number(parts[1]), valid: parts.length === 2
      };
    });
  }
  function people(config) {
    return String(config.birthdayPeople || '').split(/\r?\n/).filter(line => line.trim()).map(line => {
      const parts = line.split('|').map(value => value.trim());
      const date = /^(\d{1,2})\/(\d{1,2})$/.exec(parts[3] || '');
      return {
        dept: parts[0], name: parts[1], gender: parts[2], month: Number(date?.[1]), day: Number(date?.[2]), valid: parts.length === 4
      };
    });
  }
  function validate(event, checkDates = true) {
    if (!event || typeof event !== 'object' || !event.id || typeof event.title !== 'string') return '이벤트 정보가 올바르지 않습니다.';
    if (![0, 1, 2, 3].includes(Number(event.game))) return '지원하지 않는 게임입니다.';
    if (checkDates && (!Number.isFinite(Date.parse(event.start)) || !Number.isFinite(Date.parse(event.end)) || Date.parse(event.end) <= Date.parse(event.start))) return '시작·종료 일시를 올바르게 입력해주세요. 종료는 시작 이후여야 합니다.';
    const config = event.config || {
    };
    if (Number(event.game) === 0 && (!Number.isSafeInteger(Number(config.targetOrder)) || Number(config.targetOrder) < 1)) return '당첨 순번은 1 이상의 정수여야 합니다.';
    if (Number(event.game) === 1) {
      const rows = prizes(config);
      if (rows.length < 4 || rows.some(row => !row.valid || !row.name || !Number.isFinite(row.weight) || row.weight <= 0) || !Number.isFinite(rows.reduce((sum, row) => sum + row.weight, 0))) return '룰렛 경품을 4개 이상 입력하고 각 줄에 경품명 | 양수 가중치를 입력해주세요.';
    }
    if (Number(event.game) === 2) {
      const options = String(config.quizOptions || '').split(/\r?\n/).map(value => value.trim()).filter(Boolean);
      if (!String(config.quizQuestion || '').trim() || options.length < 2 || new Set(options).size !== options.length || !options.includes(String(config.quizAnswer || '').trim())) return '퀴즈 질문, 중복 없는 선택지 2개 이상, 선택지와 일치하는 정답을 입력해주세요.';
      if (!Number.isSafeInteger(Number(config.quizSeconds)) || Number(config.quizSeconds) < 5) return '퀴즈 제한 시간은 5 이상의 정수여야 합니다.';
    }
    if (Number(event.game) === 3) {
      const rows = people(config);
      if (!rows.length || rows.some(row => {
        const date = new Date(2024, row.month - 1, row.day);
        return !row.valid || !row.dept || !row.name || !['남', '여'].includes(row.gender) || date.getMonth() !== row.month - 1 || date.getDate() !== row.day;
      })) return '생일자는 부서 | 이름 | 남/여 | 월/일 형식의 유효한 날짜로 입력해주세요.';
    }
    return '';
  }
  return {
    read, records, saveRecord, clearRecords, settings, uid, locked, prizes, people, validate
  };

// Participants = demo base count + completed entries logged in this browser.
function syncParticipants(){
  const log=partLog().filter(x=>x.completed);
  let ch=false;
  for(const e of data){
    if(e.base===undefined){
      e.base=+e.participants||0;
      ch=true
    }
    const n=e.base+log.filter(x=>x.eventId===e.id).length;
    if(e.participants!==n){
      e.participants=n;
      ch=true
    }
  }
  if(ch)persist()
}

// 데모 수정: 실제 참여 기록, 기간 필터, 설정 저장, 실제 게임 미리보기
// ============================================================
let analyticsPeriod = '30';
function action(actionName, eventId, game) {
  try {
    if (actionName === 'create') {
      editId = null;
      createGame = 1;
      return setPage('create');
    }
    if (actionName === 'go-events') {
      editId = null;
      return setPage('events');
    }
    if (actionName === 'edit') {
      const event = data.find(row => row.id === eventId);
      if (!event) return toast('이벤트를 찾을 수 없습니다.');
      editId = eventId;
      createGame = event.game;
      return setPage('create');
    }
    if (actionName === 'select-game') {
      editId = null;
      createGame = Number(game);
      return setPage('create');
    }
    if (actionName === 'save-draft') return saveEvent(true);
    if (actionName === 'save-settings') return saveSettings();
    if (actionName === 'preview-form') return preview(formEvent());
    if (actionName === 'preview') return preview(data.find(row => row.id === eventId));
    if (actionName === 'share') {
      const event = data.find(row => row.id === eventId);
      return event && isImplementedGame(event.game) ? showShareLink(event) : toast('직원용 게임이 제공되지 않는 유형입니다.');
    }
    if (actionName === 'export-data') return backupData();
    if (actionName === 'import-data') return $('#importFile').click();
    if (actionName === 'export-winners') return download('gplay-winners.csv', winnersCsv(), 'text/csv;charset=utf-8');
    if (actionName === 'export-stats') return download('gplay-stats.csv', csv(periodData()), 'text/csv;charset=utf-8');
    if (['copy', 'end', 'delete', 'reset'].includes(actionName)) {
      const before = structuredClone(data);
      const oldRecords = DemoStore.records();
      const oldDeleted = DemoStore.read('gplay_deleted_events', []);
      if (actionName === 'copy') {
        const original = data.find(row => row.id === eventId);
        if (!original) return;
        data.unshift({
          ...structuredClone(original), id: id(), title: original.title + ' (복사본)', status: 'draft', participants: 0, base: 0, created: today()
        });
      }
      if (actionName === 'end') data = data.map(row => row.id === eventId ? {
        ...row, status: 'ended'
      }
      : row);
      if (actionName === 'delete') {
        if (!confirm('이 이벤트를 삭제할까요?')) return;
        data = data.filter(row => row.id !== eventId);
      }
      if (actionName === 'reset') {
        if (!confirm('이벤트와 참여 기록을 지우고 샘플 데이터로 초기화할까요?')) return;
        data = structuredClone(seed);
      }
      if (!persist()) {
        data = before;
        return;
      }
      try {
        if (actionName === 'delete') localStorage.setItem('gplay_deleted_events', JSON.stringify([...new Set([...oldDeleted, eventId])]));
        if (actionName === 'reset') {
          DemoStore.clearRecords();
          const removed = before.filter(row => !data.some(event => event.id === row.id)).map(row => row.id);
          localStorage.setItem('gplay_deleted_events', JSON.stringify([...new Set([...oldDeleted, ...removed])].filter(id => !data.some(row => row.id === id))));
        }
      }
      catch (error) {
        data = before;
        persist();
        DemoStore.clearRecords();
        oldRecords.forEach(DemoStore.saveRecord);
        localStorage.setItem('gplay_deleted_events', JSON.stringify(oldDeleted));
        throw error;
      }
      if (actionName === 'reset') setPage('dashboard');
      else render();
      toast({
        copy: '이벤트를 복사했습니다.', end: '이벤트를 종료했습니다.', delete: '이벤트를 삭제했습니다.', reset: '이벤트와 참여 기록을 초기화했습니다.'
      }
      [actionName]);
    }
  }
  catch (error) {
    toast('처리하지 못했습니다: ' + error.message);
  }
}
function partLog() {
  try {
    const ids = new Set(data.map(event => event.id));
    return DemoStore.records().filter(row => ids.has(row.eventId));
  }
  catch (error) {
    toast('참여 기록을 읽지 못했습니다: ' + error.message);
    return [];
  }
}
function persist() {
  try {
    localStorage.setItem('gplay_events', JSON.stringify(data));
    return true;
  }
  catch {
    toast('저장하지 못했습니다. 브라우저 저장소 권한과 용량을 확인해주세요.');
    return false;
  }
}
function last7() {
  const days = [];
  for (let offset = 6; offset >= 0; offset--) {
    const date = new Date();
    date.setHours(0, 0, 0, 0);
    date.setDate(date.getDate() - offset);
    days.push({
      d: date, label: `${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`, n: 0
    });
  }
  for (const row of partLog().filter(row => row.completed)) {
    const date = new Date(row.completedAt || row.createdAt);
    date.setHours(0, 0, 0, 0);
    const bucket = days.find(day => day.d.getTime() === date.getTime());
    if (bucket) bucket.n++;
  }
  return days;
}
function monthN() {
  const now = new Date();
  return partLog().filter(row => {
    const date = new Date(row.completedAt || row.createdAt);
    return row.completed && date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth();
  }).length;
}
function chartHtml() {
  const series = last7();
  const top = Math.ceil(Math.max(4, ...series.map(day => day.n)) / 4) * 4;
  const line = 'M' + series.map((day, index) => `${index * 100},${150 - day.n / top * 140}`).join(' L');
  return `<div class="chart" aria-label="최근 7일 완료 참여 건수">
    <div class="chart-labels">${[top, top * .75, top * .5, top * .25, 0].map(value => `<span>${value}</span>`).join('')}</div>
    <div class="chart-grid"></div>
    <svg viewBox="0 0 600 160" preserveAspectRatio="none" role="img" aria-label="${series.map(day => `${day.label} ${day.n}건`).join(', ')}">
      <path d="${line} L600,160 L0,160 Z" fill="#2463eb18" />
      <path d="${line}" fill="none" stroke="#3c6fe8" stroke-width="3" />
    </svg>
    <div class="x-labels">${series.map(day => `<span>${day.label}</span>`).join('')}</div>
  </div><p class="help">이 브라우저의 완료 기록 기준 · 샘플 누적 수치 제외</p>`;
}
function periodEntries() {
  const now = new Date();
  const start = new Date(now);
  start.setHours(0, 0, 0, 0);
  if (analyticsPeriod === 'year') start.setMonth(0, 1);
  else start.setDate(start.getDate() - Number(analyticsPeriod) + 1);
  return partLog().filter(row => {
    const time = Date.parse(row.completedAt || row.createdAt);
    return row.completed && time >= start.getTime() && time <= now.getTime();
  });
}
function periodData() {
  const entries = periodEntries();
  return data.map(event => ({
    ...event, participants: entries.filter(row => row.eventId === event.id).length
  }));
}
function analyticsPage() {
  const events = periodData();

    </select><button class="btn" data-action="export-stats">CSV 다운로드</button>`)
  + `<div class="grid stats-grid">
      ${[['완료 참여', total], ['참여 이벤트', sorted.length], ['당첨 참여', winners], ['당첨률', `${total ? (winners / total * 100).toFixed(1) : '0.0'}%`]].map(([label, value]) => `<div class="card stat"><div class="stat-top">${label}</div><div class="stat-value">${value}</div><div class="stat-foot">선택 기간 기준</div></div>`).join('')}
    </div><div class="grid dash-grid"><div class="card"><div class="card-head"><h3>게임 유형별 참여</h3></div><div class="card-body">
      ${GAMES.map((game, index) => {
        const count = events.filter(event => event.game === index).reduce((sum, event) => sum + event.participants, 0);
        return count ? `<p>${game[1]} ${game[0]} · ${count}건</p><progress max="${Math.max(total, 1)}" value="${count}" style="width:100%"></progress>` : '';
      }).join('') || '<p class="help">선택 기간에 완료된 참여가 없습니다.</p>'}
    </div></div><div class="card"><div class="card-head"><h3>참여 상위 이벤트</h3></div><div class="card-body activity">
      ${sorted.slice(0, 5).map(event => `<div class="activity-row"><div class="activity-dot"></div><div><b>${esc(event.title)}</b><p>${gameName(event.game)}</p></div><time>${event.participants}건</time></div>`).join('') || '<p class="help">참여 기록이 없습니다.</p>'}
    </div></div></div>`;
}
function settingsPage() {
  const settings = DemoStore.settings();
  return head('서비스 설정', '표시 정보와 데모 옵션을 이 브라우저에 저장합니다.', '<button class="btn primary" data-action="save-settings">설정 저장</button>') + `
    <form id="settingsForm"><div class="settings-cols">
      <div class="card panel"><h3>서비스 기본 정보</h3><div class="form-grid" style="grid-template-columns:1fr">
        <div class="form-item"><label for="settingName">서비스명</label><input id="settingName" name="name" required maxlength="40" value="${attr(settings.name)}"></div>
        <div class="form-item"><label for="settingOrganization">관리자 조직</label><input id="settingOrganization" name="organization" required maxlength="60" value="${attr(settings.organization)}"></div>
        <div class="form-item"><label for="settingHours">새 이벤트 기본 시간</label><select id="settingHours" name="hours"><option value="office" ${settings.hours === 'office' ? 'selected' : ''}>09:00 ~ 18:00</option><option value="all" ${settings.hours === 'all' ? 'selected' : ''}>00:00 ~ 23:59</option></select></div>
      </div></div>
      <div class="card panel"><h3>알림 및 표시 옵션</h3>
        ${[['notifications', '종료 이벤트 알림', '상단 알림 버튼에서 종료된 이벤트 목록을 확인합니다.'], ['statistics', '대시보드 통계 표시', '대시보드의 통계 카드와 그래프를 표시합니다.'], ['preview', '직원 화면 미리보기', '관리자 화면에서 실제 게임을 시험합니다.']].map(([key, title, description]) => `<label class="switch-row"><span><b>${title}</b><span class="subtext" style="display:block">${description}</span></span><input class="switch" name="${key}" type="checkbox" ${settings[key] ? 'checked' : ''}></label>`).join('')}
      </div>
    </div></form>
    <div class="card panel"><h3>테스트 데이터 관리</h3><p class="help">이벤트·참여 기록·서비스 설정을 함께 백업합니다. 실제 개인정보는 입력하지 마세요.</p>
      <div class="notice">현재 이벤트 <b>${data.length}개</b> · 참여 <b>${partLog().length}건</b></div>
      <div class="actions" style="margin-top:15px"><button class="btn" data-action="export-data">데이터 백업 (JSON)</button><button class="btn" data-action="import-data">백업 가져오기</button><button class="btn danger" data-action="reset">샘플 데이터로 초기화</button></div>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div><div class="notice">독립 실행형 데모 · 같은 출처의 브라우저 저장소 기준 · v1.2.0</div>`;
}
function applySettings() {
  const settings = DemoStore.settings();
  // The product wordmark stays consistent; service settings are shown in the breadcrumb and title.
  $('.crumb').firstChild.textContent = settings.name + ' ';
  $('.sidebar .user small').textContent = settings.organization;
  document.title = `${settings.name} Admin | 이벤트 운영`;
  if (page === 'dashboard' && !settings.statistics) {
    $$('#content .stats-grid, #content .dash-grid > .card:first-child').forEach(element => element.hidden = true);
  }
  $$('[data-action="preview"], [data-action="preview-form"]').forEach(button => button.disabled = !settings.preview);
}
function bindPage() {
  bindBasePage();
  $('#period')?.addEventListener('change', event => {
    analyticsPeriod = event.target.value; render();
  });
  $('#settingsForm')?.addEventListener('submit', event => {
    event.preventDefault(); saveSettings();
  });
}
function saveSettings() {
  const form = $('#settingsForm');
  if (!form?.reportValidity()) return;
  const values = Object.fromEntries(new FormData(form));
  const settings = {
    name: values.name.trim(), organization: values.organization.trim(), hours: values.hours,
    notifications: form.elements.notifications.checked, statistics: form.elements.statistics.checked, preview: form.elements.preview.checked
  };
  if (!settings.name || !settings.organization) return toast('서비스명과 관리자 조직을 입력해주세요.');
  try {
    localStorage.setItem('gplay_settings_v2', JSON.stringify(settings));
    applySettings();
    toast('설정을 저장했습니다.');
  }
  catch {
    toast('설정을 저장하지 못했습니다.');
  }
}
function formEvent() {
  const form = $('#eventForm');
  const values = Object.fromEntries(new FormData(form));
  const old = data.find(event => event.id === editId);
  const config = Object.fromEntries(Object.entries(values).filter(([key]) => key.startsWith('cfg_')).map(([key, value]) => [key.slice(4), value]));
  return {
    id: editId || id(), title: values.title.trim() || '제목 없는 이벤트', game: createGame,
    status: old?.status === 'ended' ? 'ended' : 'scheduled', start: values.start, end: values.end,
    target: Number(values.target) || 0, participants: old?.participants || 0, base: old?.base ?? 0,
    prize: values.prize, desc: values.desc, config, multiple: form.elements.multiple.checked,
    showResult: form.elements.showResult.checked, created: old?.created || today(), updatedAt: new Date().toISOString()
  };
}
function saveEvent(draft) {
  const form = $('#eventForm');
  if (!form) return;
  if (!draft && !form.reportValidity()) return;
  const event = formEvent();
  if (!draft) {
    const error = DemoStore.validate(event);
    if (error) return toast(error);
    if (event.status !== 'ended' && Date.parse(event.end) <= Date.now()) return toast('종료 일시가 현재 시각보다 이전입니다.');
  }
  if (event.start && event.end && Date.parse(event.end) <= Date.parse(event.start)) return toast('종료 일시는 시작 일시 이후여야 합니다.');
  if (draft) event.status = 'draft';
  const before = data;
  data = editId ? data.map(row => row.id === editId ? event : row) : [event, ...data];
  if (!persist()) {
    data = before;
    return;
  }
  editId = null;
  setPage('events');
  toast(draft ? '임시 저장했습니다.' : '이벤트를 저장했습니다.');
  if (!draft) showShareLink(event);
}
function eventLink(event, preview = false) {
  const url = new URL('U.stra PLAY-Games.html', location.href.split('#')[0]);
  if (preview) url.searchParams.set('preview', '1');
  url.hash = 'event=' + toBase64Url(JSON.stringify(event));
  return url.href;
}
function preview(event) {
  if (!event || !DemoStore.settings().preview) return;
  const error = DemoStore.validate(event, false);
  if (error) return toast(error);
  $('#modal').innerHTML = `<div class="modal"><div class="modal-head"><h2>직원용 게임 미리보기</h2><button class="close" data-close aria-label="닫기">×</button></div>
    <div class="modal-body"><p class="help">입력 중인 설정으로 게임을 시험합니다. 참여 기록과 통계에 반영하지 않습니다.</p>
      <iframe title="직원용 게임 미리보기" src="${attr(eventLink(event, true))}" style="width:100%;height:65vh;border:1px solid #e4e9f1;border-radius:12px"></iframe>
    </div><div class="modal-foot"><button class="btn" data-close>닫기</button></div></div>`;
  $('#modal').classList.add('show');
  $$('[data-close]').forEach(button => button.onclick = closeModal);
}
function closeModal() {
  $('#modal').classList.remove('show');
  $('#modal').innerHTML = '';
}
function showNotifications() {
  if (!DemoStore.settings().notifications) return toast('종료 이벤트 알림이 꺼져 있습니다.');
  const ended = data.filter(event => status(event) === 'ended');
  $('#modal').innerHTML = `<div class="modal"><div class="modal-head"><h2>종료 이벤트 알림</h2><button class="close" data-close>×</button></div><div class="modal-body">${ended.map(event => `<p><b>${esc(event.title)}</b> · ${fmt(event.end)}</p>`).join('') || '<p>종료된 이벤트가 없습니다.</p>'}</div></div>`;
  $('#modal').classList.add('show');
  $$('[data-close]').forEach(button => button.onclick = closeModal);
}
function backupData() {
  download('gplay-backup.json', JSON.stringify({
    version: 2, events: data, participations: partLog(), settings: DemoStore.settings()
  }, null, 2), 'application/json');
}
function importFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) return toast('백업 파일은 10MB 이하로 선택해주세요.');
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const events = Array.isArray(parsed) ? parsed : parsed.events;
      const entries = Array.isArray(parsed) ? [] : parsed.participations;
      if (!Array.isArray(events) || !Array.isArray(entries) || events.some(row => !row || typeof row.id !== 'string' || typeof row.title !== 'string' || !Number.isInteger(Number(row.game))) || new Set(events.map(row => row.id)).size !== events.length) throw Error('이벤트 형식이 올바르지 않습니다.');
      if (entries.some(row => !row || typeof row.id !== 'string' || !events.some(event => event.id === row.eventId) || typeof row.completed !== 'boolean')) throw Error('참여 기록 형식이 올바르지 않습니다.');
      if (!confirm('현재 이벤트와 참여 기록을 백업 내용으로 교체할까요?')) return;
      // 저장 실패 시 교체 직전 상태를 복구합니다.
      const saved = {
      };
      const keys = Object.keys(localStorage).filter(key => key.startsWith('gplay_'));
      keys.forEach(key => saved[key] = localStorage.getItem(key));
      try {
        localStorage.setItem('gplay_events', JSON.stringify(events));
        DemoStore.clearRecords();
        entries.forEach(DemoStore.saveRecord);
        if (!Array.isArray(parsed) && parsed.settings) localStorage.setItem('gplay_settings_v2', JSON.stringify(parsed.settings));
        localStorage.removeItem('gplay_deleted_events');
      }
      catch (error) {
        Object.keys(localStorage).filter(key => key.startsWith('gplay_')).forEach(key => localStorage.removeItem(key));
        Object.entries(saved).forEach(([key, value]) => localStorage.setItem(key, value));
        throw error;
      }
      data = events;
      setPage('dashboard');
      toast('백업을 복원했습니다.');
    }
    catch (error) {
      toast('백업을 가져오지 못했습니다: ' + error.message);
    }
  };
  reader.onerror = () => toast('백업 파일을 읽지 못했습니다.');
  reader.readAsText(file);
}
window.addEventListener('storage', event => {
  if (event.key?.startsWith('gplay_')) {
    data = loadData();
    // 작성 중인 폼은 덮어쓰지 않습니다. 목록·통계 화면은 즉시 갱신합니다.
    if (!['create', 'settings'].includes(page)) render();
  }
});
window.addEventListener('focus', () => {
  data = loadData(); if (!['create', 'settings'].includes(page)) render();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeModal();
});
$$('.sidebar .nav button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.page==='create'){
    editId=null;createGame=1
  }
  setPage(b.dataset.page)
}));
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='modal')closeModal()
});
$('#today').textContent=new Date().toLocaleDateString('ko-KR',{
  year:'numeric',month:'long',day:'numeric'
});
$('.topbar [title="알림"]').onclick=showNotifications;
if(localStorage.getItem('gplay_events')===null)persist();
render();

</script>
</body>
</html>
