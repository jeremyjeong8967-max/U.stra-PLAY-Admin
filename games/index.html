    <!-- 1. 공통 화면 스타일 및 모바일 반응형 레이아웃 -->
    <style>
      :root {
        --blue: #0354ff;
        --ink: #20283a;
        --muted: #758198;
        --line: #e4e9f1;
        --bg: #f6f9ff;
        --green: #16865d;
        --red: #cf4350;
        --shadow: 0 20px 60px #10224418
      }
      * {
        box-sizing: border-box
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0,#eef3ff,#f5f7fb 50%);
        color: var(--ink);
        font-family: system-ui,-apple-system,"Segoe UI",sans-serif
      }
      .shell {
        max-width: 760px;
        margin: 0 auto;
        padding: 34px 18px 60px
      }
      .brand {
        font-weight: 800;
        color: var(--blue);
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 20px
      }
      .brandmark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--blue);
        color: #fff;
        display: grid;
        place-items: center
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden
      }
      .hero {
        background: linear-gradient(135deg,#285dd9,#8193f2);
        color: white;
        padding: 27px
      }
      .hero small {
        opacity: .8;
        letter-spacing: 1px
      }
      .hero h1 {
        margin: 10px 0 5px;
        font-size: 25px
      }
      .hero p {
        margin: 0;
        opacity: .86;
        font-size: 13px
      }
      .body {
        padding: 24px
      }
      .meta {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 15px;
        flex-wrap: wrap
      }
      .description {
        font-size: 13px;
        line-height: 1.7;
        color: #57657b;
        margin: 15px 0
      }
      .game-area {
        margin-top: 20px;
        background: #f7f9fd;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 22px
      }
      .btn {
        border: 0;
        border-radius: 9px;
        background: var(--blue);
        color: #fff;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer
      }
      .btn:disabled {
        opacity: .5;
        cursor: not-allowed
      }
      .btn.block {
        width: 100%
      }
      .field {
        margin: 13px 0
      }
      .field label {
        font-size: 12px;
        font-weight: 700;
        display: block;
        margin-bottom: 6px
      }
      .field input,.field textarea {
        width: 100%;
        border: 1px solid #dce3ee;
        border-radius: 8px;
        padding: 11px;
        font: inherit
      }
      .gate {
        position: fixed;
        inset: 0;
        background: #10182dcc;
        display: grid;
        place-items: center;
        padding: 18px;
        z-index: 10
      }
      .gatebox {
        width: min(480px,100%);
        background: #fff;
        border-radius: 16px;
        padding: 25px;
        box-shadow: var(--shadow)
      }
      .gatebox h1 {
        margin: 8px 0;
        font-size: 21px
      }
      .gatebox p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6
      }
      .hidden {
        display: none!important
      }
      .prize-layout {
        display: grid;
        grid-template-columns: minmax(240px,1fr) minmax(200px,.75fr);
        align-items: center;
        gap: 22px
      }
      .wheel-wrap {
        position: relative;
        max-width: 330px;
        margin: auto;
        width: 100%
      }
      .wheel {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 9px solid white;
        box-shadow: 0 8px 25px #152b5726;
        transition: transform 5.5s cubic-bezier(.12,.72,.1,1);
        background: conic-gradient(#f9bf55 0 120deg,#58b8a0 120deg 240deg,#788bea 240deg)
      }
      .pointer {
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 27px solid #263653;
        filter: drop-shadow(0 2px 2px #0003)
      }
      .wheel-center {
        position: absolute;
        inset: 40%;
        background: #fff;
        border-radius: 50%;
        border: 5px solid #dfe5f0;
        display: grid;
        place-items: center;
        font-size: 25px
      }
      .prizes {
        display: grid;
        gap: 9px
      }
      .prize-row {
        background: #fff;
        border: 1px solid var(--line);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 8px
      }
      .result {
        margin-top: 15px;
        background: #edf4ff;
        border: 1px solid #d8e4ff;
        border-radius: 10px;
        padding: 14px;
        text-align: center;
        font-weight: 700
      }
      .question {
        font-size: 18px;
        font-weight: 750;
        line-height: 1.5;
        margin-bottom: 16px
      }
      .options {
        display: grid;
        gap: 9px
      }
      .option {
        background: #fff;
        border: 1px solid #dce3ee;
        padding: 12px;
        border-radius: 9px;
        text-align: left;
        cursor: pointer
      }
      .option:hover {
        border-color: var(--blue);
        background: #f5f8ff
      }
      .option.correct {
        background: #e9f8f0;
        border-color: #8bd2ad
      }
      .option.wrong {
        background: #fff0f1;
        border-color: #edabb0
      }
      .timer {
        font-size: 12px;
        color: var(--muted);
        text-align: right
      }
      .birth-inputs {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0
      }
      .birth-inputs input {
        width: 96px;
        text-align: center;
        font-size: 18px;
        padding: 12px;
        border: 1px solid #dce3ee;
        border-radius: 9px
      }
      .choice-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(120px,1fr));
        gap: 9px
      }
      .step-tag {
        font-size: 11px;
        font-weight: 800;
        color: var(--blue);
        margin-bottom: 6px
      }
      .foot {
        text-align: center;
        color: #9ba5b5;
        font-size: 10px;
        margin-top: 16px
      }
      @media(max-width:620px) {
        .shell {
          padding: 20px 12px 45px
        }
        .body {
          padding: 17px
        }
        .hero {
          padding: 22px
        }
        .hero h1 {
          font-size: 21px
        }
        .prize-layout {
          grid-template-columns: 1fr
        }
        .wheel-wrap {
          max-width: 270px
        }
        .game-area {
          padding: 17px
        }
      }
      .demo-note {
        font-size: 11px;
        color: #7d899c;
        line-height: 1.6;
      }
      #gameError {
        color: #b42335;
        line-height: 1.6;
      }
      /* 8. U.stra PLAY brand theme. Shared color/type tokens match the admin HTML.
         The inline wordmark and favicon keep this file self-contained. */
      :root {
        --brand-primary: #0354ff;
        --brand-hover: #0344ce;
        --brand-tint: #edf3ff;
        --brand-surface: #f6f9ff;
        --brand-ink: #171a21;
        --brand-border: #e6eaef;
        --brand-radius: 20px;
        --brand-font: 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        --blue: var(--brand-primary);
        --bg: var(--brand-surface);
        --ink: var(--brand-ink);
        --line: var(--brand-border);
        --shadow: 0 16px 52px #163b7510;
      }
      body { background: var(--brand-surface); font-family: var(--brand-font); }
      button, input, textarea { font: inherit; }
      .shell { max-width: 840px; padding-top: 40px; }
      .brand { margin-bottom: 26px; }
      .brand-wordmark { display: block; width: 174px; height: 34px; max-width: 100%; }
      .card { border-radius: var(--brand-radius); box-shadow: var(--shadow); }
      .hero {
        background: var(--brand-tint);
        border-bottom: 1px solid #dce6fc;
        color: var(--brand-ink);
        padding: 32px;
      }
      .hero small { color: var(--brand-primary); font-size: 11px; font-weight: 750; letter-spacing: 1.5px; opacity: 1; }
      .hero h1 { margin-top: 16px; font-size: 30px; line-height: 1.4; letter-spacing: -1px; }
      .hero p { color: #5b6b85; opacity: 1; }
      .body { padding: 30px; }
      .meta { gap: 10px; line-height: 1.6; }
      .description { line-height: 1.8; }
      .game-area { border-radius: 16px; background: #fafcff; padding: 26px; }
      .game-area h2 { letter-spacing: -.6px; line-height: 1.5; }
      .btn { min-height: 48px; border-radius: 10px; background: var(--brand-primary); }
      .btn:hover:not(:disabled) { background: var(--brand-hover); }
      .gate {
        background: radial-gradient(ellipse at 15% 15%, #dce9ff 0, transparent 48%),
          radial-gradient(ellipse at 95% 85%, #e4eaff 0, transparent 50%), var(--brand-surface);
        overflow-y: auto;
      }
      .gatebox { width: min(480px, 100%); padding: 36px; border: 1px solid var(--brand-border); border-radius: 24px; }
      .gatebox .brand { border-bottom: 1px solid var(--brand-border); padding-bottom: 24px; margin-bottom: 24px; }
      .gatebox h1 { font-size: 25px; line-height: 1.45; letter-spacing: -.8px; }
      .field { margin: 20px 0; }
      .field input { min-height: 48px; background: #fbfcff; border-color: var(--brand-border); border-radius: 10px; }
      .option { min-height: 48px; border-radius: 10px; }
      .option:hover:not(:disabled) { background: var(--brand-tint); border-color: var(--brand-primary); }
      .result { color: #174bb2; background: var(--brand-tint); border-color: #dce6fc; border-radius: 12px; line-height: 1.7; }
      .wheel-center { border-color: #e6eeff; }
      .play-symbol { width: 32px; height: 32px; }
      .foot { color: #7d8799; line-height: 1.7; }
      #gameError, #gateMessage { color: var(--red); line-height: 1.6; }
      input:focus { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
      button:focus-visible { outline: 3px solid #91b5ff; outline-offset: 3px; }
      @media (max-width: 620px) {
        .shell { padding: 24px 14px 40px; }
        .hero, .body { padding: 22px; }
        .hero h1 { font-size: 25px; }
        .gatebox { padding: 26px; }
        .game-area { padding: 20px; }
        .gatebox h1 { font-size: 23px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .wheel { transition-duration: .01ms; }
      }
    </style>
  </head>

    <!-- 4. 공통 저장소 → 참여 처리 → 게임별 로직 → 초기화 -->
    <script>
      // 공통 데모 데이터 규약. 두 HTML에 같은 코드를 내장해 별도 의존성 없이 실행합니다.
      // 실제 서비스에서는 이 저장소와 URL 스냅샷을 인증된 서버 API로 교체하세요.
      const DemoStore = (() => {
        const ENTRY_PREFIX = 'gplay_entry_v2:';
        const DEFAULT_SETTINGS = {
          name: 'U.stra PLAY', organization: '서비스 운영팀', hours: 'office',
          notifications: true, statistics: true, preview: true,
        };

        function read(key, fallback) {
          const raw = localStorage.getItem(key);
          return raw === null ? fallback : JSON.parse(raw);
        }

        function records() {
          // 기존 배열은 읽기 전용으로 병합합니다. 새 기록은 참여별 키에 저장합니다.
          const legacy = read('gplay_participations', []);
          const map = new Map((Array.isArray(legacy) ? legacy : [])
            .filter(row => row && row.id && row.eventId).map(row => [row.id, row]));
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!key?.startsWith(ENTRY_PREFIX)) continue;
            const row = read(key, null);
            if (row?.id && row.eventId) map.set(row.id, row);
          }
          return [...map.values()];
        }

        function saveRecord(row) {
          localStorage.setItem(ENTRY_PREFIX + row.id, JSON.stringify(row));
        }

        function clearRecords() {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key?.startsWith(ENTRY_PREFIX)) keys.push(key);
          }
          keys.forEach(key => localStorage.removeItem(key));
          localStorage.removeItem('gplay_participations');
        }

        function settings() {
          try {
            const saved = read('gplay_settings_v2', {}) || {};
            // Migrate only the former default brand; preserve custom workspace names.
            const name = saved.name === 'G-PLAY' ? DEFAULT_SETTINGS.name : (saved.name || DEFAULT_SETTINGS.name);
            return { ...DEFAULT_SETTINGS, ...saved, name };
          } catch {
            return { ...DEFAULT_SETTINGS };
          }
        }

        function uid() {
          return self.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }

        async function locked(callback) {
          // Web Locks가 있으면 같은 출처의 여러 탭에서 등록/완료를 직렬화합니다.
          if (navigator.locks) return navigator.locks.request('gplay-participation-v2', callback);
          throw new Error('이 브라우저에서는 참여 잠금을 지원하지 않습니다. 최신 Edge/Chrome에서 열어주세요.');
        }

        function prizes(config) {
          return String(config.prizeItems || '').split(/\r?\n/).filter(line => line.trim()).map(line => {
            const parts = line.split('|').map(value => value.trim());
            return { name: parts[0], weight: Number(parts[1]), valid: parts.length === 2 };
          });
        }

        function people(config) {
          return String(config.birthdayPeople || '').split(/\r?\n/).filter(line => line.trim()).map(line => {
            const parts = line.split('|').map(value => value.trim());
            const date = /^(\d{1,2})\/(\d{1,2})$/.exec(parts[3] || '');
            return { dept: parts[0], name: parts[1], gender: parts[2], month: Number(date?.[1]), day: Number(date?.[2]), valid: parts.length === 4 };
          });
        }

        function validate(event, checkDates = true) {
          if (!event || typeof event !== 'object' || !event.id || typeof event.title !== 'string') return '이벤트 정보가 올바르지 않습니다.';
          if (![0, 1, 2, 3].includes(Number(event.game))) return '지원하지 않는 게임입니다.';
          if (checkDates && (!Number.isFinite(Date.parse(event.start)) || !Number.isFinite(Date.parse(event.end)) || Date.parse(event.end) <= Date.parse(event.start))) return '시작·종료 일시를 올바르게 입력해주세요. 종료는 시작 이후여야 합니다.';
          const config = event.config || {};
          if (Number(event.game) === 0 && (!Number.isSafeInteger(Number(config.targetOrder)) || Number(config.targetOrder) < 1)) return '당첨 순번은 1 이상의 정수여야 합니다.';
          if (Number(event.game) === 1) {
            const rows = prizes(config);
            if (rows.length < 4 || rows.some(row => !row.valid || !row.name || !Number.isFinite(row.weight) || row.weight <= 0) || !Number.isFinite(rows.reduce((sum, row) => sum + row.weight, 0))) return '룰렛 경품을 4개 이상 입력하고 각 줄에 경품명 | 양수 가중치를 입력해주세요.';
          }
          if (Number(event.game) === 2) {
            const options = String(config.quizOptions || '').split(/\r?\n/).map(value => value.trim()).filter(Boolean);
            if (!String(config.quizQuestion || '').trim() || options.length < 2 || new Set(options).size !== options.length || !options.includes(String(config.quizAnswer || '').trim())) return '퀴즈 질문, 중복 없는 선택지 2개 이상, 선택지와 일치하는 정답을 입력해주세요.';
            if (!Number.isSafeInteger(Number(config.quizSeconds)) || Number(config.quizSeconds) < 5) return '퀴즈 제한 시간은 5 이상의 정수여야 합니다.';
          }
          if (Number(event.game) === 3) {
            const rows = people(config);
            if (!rows.length || rows.some(row => {
              const date = new Date(2024, row.month - 1, row.day);
              return !row.valid || !row.dept || !row.name || !['남', '여'].includes(row.gender) || date.getMonth() !== row.month - 1 || date.getDate() !== row.day;
            })) return '생일자는 부서 | 이름 | 남/여 | 월/일 형식의 유효한 날짜로 입력해주세요.';
          }
          return '';
        }

        return { read, records, saveRecord, clearRecords, settings, uid, locked, prizes, people, validate };
      })();

      // ============================================================
      // 1. 화면 상수와 이벤트 불러오기
      // ============================================================
      const GAME_LABELS = { 0: '접속 순번 이벤트', 1: '행운 룰렛', 2: '오늘의 퀴즈', 3: '생일 맞추기' };
      const HIDDEN = '참여가 완료되었습니다. 결과는 별도로 안내드립니다.';
      const $ = id => document.getElementById(id);
      // GitHub Pages 직접 접속 테스트: 이벤트 링크 없이 /games/를 열면
      // 저장되지 않는 샘플 룰렛 미리보기를 표시합니다.
      const linkedEvent = readEvent();
      const previewMode = new URLSearchParams(location.search).get('preview') === '1' || !linkedEvent;
      let eventData = linkedEvent || {
        id: 'github-pages-demo-event',
        title: 'U.stra PLAY 게임 미리보기',
        game: 1,
        start: '2026-01-01T00:00',
        end: '2099-12-31T23:59',
        status: 'active',
        prize: '테스트용 가상 경품',
        desc: 'GitHub Pages에서 직원용 게임 화면을 확인하기 위한 샘플 이벤트입니다. 가상의 이름과 사번으로 테스트해 주세요.',
        multiple: false,
        showResult: true,
        config: {
          prizeItems: '커피 쿠폰 | 1\n편의점 상품권 | 1\n간식 세트 | 1\n다음 기회 | 1'
        }
      };
      let entry = null;
      let busy = false;
      let cleanupGame = () => {};

      function readEvent() {
        try {
          const token = new URLSearchParams(location.hash.slice(1)).get('event');
          if (!token) return null;
          const value = token.replace(/-/g, '+').replace(/_/g, '/');
          const binary = atob(value + '='.repeat((4 - value.length % 4) % 4));
          return JSON.parse(new TextDecoder().decode(Uint8Array.from(binary, char => char.charCodeAt(0))));
        } catch { return null; }
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      }

      function refreshEvent() {
        // 미리보기만 URL의 설정을 사용합니다. 일반 참여는 관리자 저장소가 기준입니다.
        if (previewMode) return;
        const deleted = DemoStore.read('gplay_deleted_events', []);
        if (deleted.includes(eventData?.id)) throw new Error('삭제된 이벤트입니다.');
        const events = DemoStore.read('gplay_events', []);
        const stored = Array.isArray(events) && events.find(row => row.id === eventData?.id);
        if (!stored) throw new Error('등록되지 않았거나 백업 복원으로 제거된 이벤트입니다. 관리자에게 최신 링크를 요청해주세요.');
        eventData = stored;
      }

      function isOpen() {
        if (!eventData) return false;
        if (previewMode) return true;
        if (['draft', 'ended'].includes(eventData.status)) return false;
        const now = Date.now();
        return now >= Date.parse(eventData.start) && now <= Date.parse(eventData.end);
      }

      function requireOpen() {
        refreshEvent();
        if (!isOpen()) throw new Error('현재 참여 가능한 기간이 아니거나 종료된 이벤트입니다.');
      }

      function showError(error) {
        $('gateMessage').textContent = error.message || '처리하지 못했습니다. 다시 시도해주세요.';
        if ($('gate').classList.contains('hidden')) {
          let message = $('gameError');
          if (!message) {
            message = document.createElement('p');
            message.id = 'gameError';
            message.setAttribute('role', 'alert');
            $('gameArea').appendChild(message);
          }
          message.textContent = error.message || '처리하지 못했습니다.';
        }
      }

      // ============================================================
      // 2. 참여 등록·이어하기·결과 저장
      // ============================================================
      async function start() {
        if (busy) return;
        const name = $('playerName').value.trim();
        const employeeId = $('employeeId').value.trim();
        if (!name || !employeeId) return showError(new Error('이름과 사번을 모두 입력해주세요.'));
        busy = true;
        $('joinBtn').disabled = true;
        try {
          const register = () => {
            requireOpen();
            const error = DemoStore.validate(eventData, !previewMode);
            if (error) throw new Error(error);
            const identity = 'id:' + employeeId.toLowerCase();
            const records = previewMode ? [] : DemoStore.records();
            const mine = records.filter(row => row.eventId === eventData.id && row.identity === identity);
            const completed = mine.filter(row => row.completed).sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
            // 완료된 중복 참여는 재추첨하지 않고 기존 결과를 다시 보여줍니다.
            if (!eventData.multiple && completed.length) return completed[0];
            const pending = mine.find(row => !row.completed);
            if (pending) return pending;
            const order = Math.max(0, ...records.filter(row => row.eventId === eventData.id).map(row => Number(row.order) || 0), records.filter(row => row.eventId === eventData.id).length) + 1;
            const row = {
              id: DemoStore.uid(), eventId: eventData.id, name, employeeId, identity,
              completed: false, createdAt: new Date().toISOString(), order,
              // 게임 진행 중 관리자가 설정을 바꿔도 진행하던 문제·규칙은 유지합니다.
              eventSnapshot: JSON.parse(JSON.stringify(eventData)), progress: {},
            };
            if (Number(eventData.game) === 2) row.progress.deadline = Date.now() + Number(eventData.config.quizSeconds) * 1000;
            if (!previewMode) DemoStore.saveRecord(row);
            return row;
          };
          entry = previewMode ? register() : await DemoStore.locked(register);
          $('gate').classList.add('hidden');
          if (entry.completed) showCompleted();
          else renderGame();
        } catch (error) { showError(error); }
        finally { busy = false; $('joinBtn').disabled = false; }
      }

      async function saveProgress(progress) {
        const save = () => {
          requireOpen();
          const stored = previewMode ? entry : DemoStore.records().find(row => row.id === entry.id);
          if (!stored) throw new Error('참여 기록이 초기화되었습니다. 페이지를 다시 열어주세요.');
          entry = stored;
          if (entry.completed) return false;
          const next = { ...entry, progress: { ...entry.progress, ...progress } };
          if (!previewMode) DemoStore.saveRecord(next);
          entry = next;
          return true;
        };
        return previewMode ? save() : DemoStore.locked(save);
      }

      async function finish(result, won) {
        const save = () => {
          requireOpen();
          const stored = previewMode ? entry : DemoStore.records().find(row => row.id === entry.id);
          if (!stored) throw new Error('참여 기록이 초기화되었습니다. 페이지를 다시 열어주세요.');
          if (stored.completed) { entry = stored; return; }
          const next = { ...stored, completed: true, won: Boolean(won), result: String(result), completedAt: new Date().toISOString() };
          if (!previewMode) DemoStore.saveRecord(next);
          entry = next;
        };
        if (previewMode) save();
        else await DemoStore.locked(save);
        cleanupGame();
      }

      function currentEvent() { return entry?.eventSnapshot || eventData; }

      function showCompleted() {
        cleanupGame();
        const message = currentEvent().showResult === false ? HIDDEN : entry.result;
        $('gameArea').innerHTML = `<h2>참여가 완료되었습니다</h2><div class="result" role="status">${escapeHtml(message)}</div><p>완료된 참여의 저장 결과입니다.</p>`;
      }

      function renderGame() {
        cleanupGame();
        const current = currentEvent();
        const config = current.config || {};
        if (Number(current.game) === 0) renderOrder(config);
        else if (Number(current.game) === 1) renderRoulette(config);
        else if (Number(current.game) === 2) renderQuiz(config);
        else if (Number(current.game) === 3) renderBirthday(config);
      }

      function resultText(text) { return currentEvent().showResult === false ? HIDDEN : text; }

      // ============================================================
      // 3. 접속 순번 이벤트
      // ============================================================
      function renderOrder(config) {
        $('gameArea').innerHTML = `
          <h2>내 참여 순번을 확인하세요</h2>
          <p>행운 순번 <b>${Number(config.targetOrder)}</b>번에 도달하면 당첨입니다.</p>
          <button class="btn block" id="orderBtn">내 순번 확인</button>
          <div id="orderResult" role="status"></div>
          <p class="demo-note">순번은 같은 브라우저의 참여 시작 순서입니다. 중도 이탈한 참여도 포함합니다.</p>`;
        $('orderBtn').onclick = async () => {
          $('orderBtn').disabled = true;
          try {
            const order = entry.order || 1;
            await finish(`${order}번 ${order === Number(config.targetOrder) ? '당첨' : '참여'}`, order === Number(config.targetOrder));
            $('orderResult').innerHTML = `<div class="result">${escapeHtml(resultText(entry.result))}</div>`;
          } catch (error) { $('orderBtn').disabled = false; showError(error); }
        };
      }

      // ============================================================
      // 4. 행운 룰렛: 저장 성공 후 연출, 재접속 시 같은 결과 표시
      // ============================================================
      function renderRoulette(config) {
        // 1차 샘플: 관리자 설정에 저장된 기존 가중치와 관계없이 모든 룰렛 항목을 균등 처리합니다.
        // 추후 가중치형을 도입할 때 이 부분을 추첨 방식 설정에 따라 분기합니다.
        // 샘플 룰렛은 경품 설정의 가중치와 무관하게 정확히 4개의 90도 영역으로 표시합니다.
        const prizes = DemoStore.prizes(config).slice(0, 4).map(prize => ({ ...prize, weight: 1 }));
        const total = prizes.length;
        const colors = ['#f5b94e', '#54b39d', '#7388e8', '#e57b8b'];
        // 각 색상 구간을 명시적으로 0~90, 90~180, 180~270, 270~360도로 고정합니다.
        const stops = prizes.map((prize, index) =>
          `${colors[index]} ${index * 90}deg ${(index + 1) * 90}deg`
        );
        $('gameArea').innerHTML = `
          <div class="prize-layout">
            <div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel" style="background:conic-gradient(${stops.join(',')})"></div><div class="wheel-center"><img class="play-symbol" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNSAyNSI+PHBhdGggZD0iTTE5LjYzNjMgNy44ODcwMkgxNS4yNzU4VjE1LjAxOEMxNS4yNzU4IDE3LjkzMzEgMTIuODM1MyAyMC4zMDMzIDkuODE4MTMgMjAuMzAzM0M2LjgwMDk2IDIwLjMwMzMgNC4zNjA0OSAxNy45Mzk5IDQuMzYwNDkgMTUuMDE4VjIuNTgxMzNMMCAwVjE1LjAxMTJDMCAxNi45NjU5IDAuNjExODc1IDE4Ljc4NDUgMS42NTI3NyAyMC4yOTY1QzIuMzcwMTQgMjEuMzMxNyAzLjI5MTQ3IDIyLjIyNCA0LjM2MDQ5IDIyLjkxODdDNS45MjE4MyAyMy45MzM1IDcuNzk5NjUgMjQuNTE5MiA5LjgxODEzIDI0LjUxOTJDMTEuODM2NiAyNC41MTkyIDEzLjcxNDQgMjMuOTI2NyAxNS4yNzU4IDIyLjkxODdDMTYuMzQ0OCAyMi4yMjQgMTcuMjY2MSAyMS4zMzE3IDE3Ljk4MzUgMjAuMjk2NUMxOS4wMzE0IDE4Ljc4NDUgMTkuNjM2MyAxNi45NjU5IDE5LjYzNjMgMTUuMDExMlY3Ljg4NzAyWiIgZmlsbD0iIzAzNTRGRiIvPjxwYXRoIGQ9Ik0yMS44MDk1IDI0LjUxOTJDMjMuMDEzNiAyNC41MTkyIDIzLjk4OTcgMjMuNTczOSAyMy45ODk3IDIyLjQwNzlDMjMuOTg5NyAyMS4yNDE4IDIzLjAxMzYgMjAuMjk2NSAyMS44MDk1IDIwLjI5NjVDMjAuNjA1MyAyMC4yOTY1IDE5LjYyOTIgMjEuMjQxOCAxOS42MjkyIDIyLjQwNzlDMTkuNjI5MiAyMy41NzM5IDIwLjYwNTMgMjQuNTE5MiAyMS44MDk1IDI0LjUxOTJaIiBmaWxsPSIjMDM1NEZGIi8+PC9zdmc+" alt="U.stra PLAY" width="32" height="32"></div></div>
            <div><h2>행운 룰렛을 돌려보세요</h2><div class="prizes">
              ${prizes.map((prize, index) => `<div class="prize-row"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${colors[index % colors.length]}"></i> ${escapeHtml(prize.name)}</span><b>25.0%</b></div>`).join('')}
            </div></div>
          </div>
          <button class="btn block" id="spinBtn" style="margin-top:18px">룰렛 돌리기</button>`;
        $('spinBtn').onclick = async () => {
          $('spinBtn').disabled = true;
          try {
            requireOpen();
            const pick = Math.random() * total;
            let sum = 0;
            let index = prizes.findIndex(prize => (sum += prize.weight) > pick);
            if (index < 0) index = prizes.length - 1;
            const prize = prizes[index];
            await finish(prize.name, !/다음 기회|꽝/.test(prize.name));
            // 다른 탭에서 먼저 완료한 결과가 있다면 그 결과를 우선합니다.
            if (entry.result !== prize.name) return showCompleted();
            const center = index * 90 + 45;
            $('wheel').style.transform = `rotate(${360 * 6 + (360 - center) % 360}deg)`;
            const timer = setTimeout(showCompleted, 5700);
            cleanupGame = () => clearTimeout(timer);
          } catch (error) { $('spinBtn').disabled = false; showError(error); }
        };
      }

      // ============================================================
      // 5. 오늘의 퀴즈: 새로고침해도 제한 시간 유지
      // ============================================================
      function renderQuiz(config) {
        const options = String(config.quizOptions).split(/\r?\n/).map(value => value.trim()).filter(Boolean);
        const answer = String(config.quizAnswer).trim();
        const deadline = entry.progress?.deadline || Date.parse(entry.createdAt) + Number(config.quizSeconds) * 1000;
        $('gameArea').innerHTML = `
          <div class="timer" id="quizTimer"></div>
          <div class="question">${escapeHtml(config.quizQuestion)}</div>
          <div class="options">${options.map((option, index) => `<button class="option" data-option="${index}">${escapeHtml(option)}</button>`).join('')}</div>
          <div id="quizResult" role="status"></div>`;
        let locked = false;
        let timer;
        let submission = null;

        // 최초 제출 당시의 판정을 유지합니다. 저장 재시도 중에는 답이나 시간을 다시 판정하지 않습니다.
        async function answerQuiz(value) {
          if (locked) return;
          locked = true;
          clearInterval(timer);
          if (!submission) {
            const expired = Date.now() >= deadline;
            const correct = !expired && value === answer;
            submission = { value, correct, result: expired ? '시간 초과' : correct ? '정답' : '오답' };
          }
          document.querySelectorAll('.option').forEach(button => { button.disabled = true; });
          const retryButton = $('quizRetry');
          if (retryButton) retryButton.disabled = true;
          try {
            await finish(submission.result, submission.correct);
            document.querySelectorAll('.option').forEach((button, index) => {
              button.disabled = true;
              if (currentEvent().showResult !== false) {
                if (options[index] === answer) button.classList.add('correct');
                if (options[index] === submission.value && !submission.correct) button.classList.add('wrong');
              }
            });
            if ($('gameError')) $('gameError').textContent = '';
            $('quizResult').innerHTML = `<div class="result">${escapeHtml(resultText(entry.result + (entry.won ? ' 🎉' : ` · 정답: ${answer}`)))}</div>`;
          } catch (error) {
            locked = false;
            showError(error);
            // 타이머를 다시 시작하면 저장 장애 중 시간 초과로 판정이 바뀔 수 있습니다.
            $('quizResult').innerHTML = '<p role="status">결과를 저장하지 못했습니다. 저장소 상태를 확인한 뒤 다시 시도해주세요. 최초 제출한 결과로 재시도합니다.</p><button class="btn block" id="quizRetry" type="button">결과 저장 다시 시도</button>';
            $('quizRetry').onclick = () => answerQuiz(submission.value);
          }
        }
        function tick() {
          const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
          $('quizTimer').textContent = `남은 시간 ${remaining}초`;
          if (!remaining) answerQuiz('');
        }
        document.querySelectorAll('.option').forEach(button => { button.onclick = () => answerQuiz(options[Number(button.dataset.option)]); });
        timer = setInterval(tick, 250);
        cleanupGame = () => clearInterval(timer);
        tick();
      }

      // ============================================================
      // 6. 생일 맞추기: 단계별 진행 저장 및 결과 비공개 일관성
      // ============================================================
      function renderBirthday(config) {
        const people = DemoStore.people(config);
        const departments = [...new Set([...String(config.birthdayDepts || '').split(/\r?\n/).map(value => value.trim()).filter(Boolean), ...people.map(person => person.dept)])];
        const ranges = [[1, 10], [11, 20], [21, 31]];
        const area = $('gameArea');
        let dept = entry.progress?.dept || '';
        let gender = entry.progress?.gender || '';

        function bind(callback) {
          area.querySelectorAll('[data-v]').forEach(button => {
            button.onclick = async () => {
              if (busy) return;
              busy = true;
              try { requireOpen(); await callback(button.dataset.v); }
              catch (error) { showError(error); }
              finally { busy = false; }
            };
          });
        }

        async function end(message, won) { await finish(message, won); showCompleted(); }
        function stepDept() {
          area.innerHTML = `<div class="step-tag">1단계 · 부서 선택</div><h2>부서를 선택하세요</h2><p>${escapeHtml(config.birthdayHint || '')}</p><div class="choice-grid">${departments.map((name, index) => `<button class="option" data-v="${index}">${escapeHtml(name)}</button>`).join('')}</div>`;
          bind(async value => {
            dept = departments[Number(value)];
            // 비공개 모드에서는 정오답에 따라 중간 화면이 달라지지 않습니다.
            if (currentEvent().showResult !== false && !people.some(person => person.dept === dept)) return end(`${dept} · 생일자 없음`, false);
            if (await saveProgress({ dept, step: 'gender' })) stepGender(); else showCompleted();
          });
        }

        function stepGender() {
          area.innerHTML = '<div class="step-tag">2단계 · 성별 맞히기</div><h2>생일자는 남성일까요, 여성일까요?</h2><div class="choice-grid"><button class="option" data-v="남">남성</button><button class="option" data-v="여">여성</button></div>';
          bind(async value => {
            gender = value;
            if (currentEvent().showResult !== false && !people.some(person => person.dept === dept && person.gender === gender)) return end(`${dept} · 성별 오답`, false);
            if (await saveProgress({ dept, gender, step: 'day' })) stepDay(); else showCompleted();
          });
        }

        function stepDay() {
          area.innerHTML = `<div class="step-tag">3단계 · 생일 구간 맞히기</div><h2>생일은 며칠일까요?</h2><div class="choice-grid">${ranges.map((range, index) => `<button class="option" data-v="${index}">${range[0]}일 ~ ${range[1]}일</button>`).join('')}</div>`;
          bind(async value => {
            const range = ranges[Number(value)];
            const hits = people.filter(person => person.dept === dept && person.gender === gender && person.day >= range[0] && person.day <= range[1]);
            await end(hits.length ? `정답: ${hits.map(person => `${person.name}님 · ${person.month}월 ${person.day}일`).join(', ')}` : `${dept} · 오답`, hits.length > 0);
          });
        }

        if (entry.progress?.step === 'day') stepDay();
        else if (entry.progress?.step === 'gender') stepGender();
        else stepDept();
      }

      // ============================================================
      // 7. 초기화 및 브라우저 이벤트
      // ============================================================
      function boot() {
        try {
          if (!eventData) throw new Error('이벤트 링크가 올바르지 않습니다. 관리자에게 최신 링크를 요청해주세요.');
          refreshEvent();
          const error = DemoStore.validate(eventData, !previewMode);
          if (error) throw new Error(error);
          const label = GAME_LABELS[Number(eventData.game)];
          document.title = `${eventData.title} | U.stra PLAY`;
          $('eventTitle').textContent = eventData.title;
          $('gameName').textContent = label;
          $('eventPeriod').textContent = `${eventData.start || ''} ~ ${eventData.end || ''}`;
          $('eventPrize').textContent = eventData.prize ? `🎁 ${eventData.prize}` : '';
          $('eventDesc').textContent = eventData.desc || '';
          $('gateTitle').textContent = eventData.title;
          $('gateDesc').textContent = previewMode ? '미리보기입니다. 참여 기록은 저장되지 않습니다.' : eventData.desc || '참여 정보를 입력한 뒤 게임을 시작하세요.';
          if (previewMode) document.querySelector('.foot').textContent = '미리보기 · 결과는 저장되지 않습니다';
          requireOpen();
          $('joinForm').onsubmit = event => { event.preventDefault(); start(); };
        } catch (error) { $('gateTitle').textContent = '참여할 수 없는 이벤트입니다'; showError(error); $('joinBtn').disabled = true; }
      }

      window.addEventListener('hashchange', () => location.reload());
      window.addEventListener('pagehide', () => cleanupGame());
      document.addEventListener('DOMContentLoaded', boot);

    </script>
  </body>
</html>
